name: StartOS package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/startos/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/startos.yml"
  push:
    branches: [main, release]
    paths:
      - "deploy/startos/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/startos.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: deploy/startos

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86
            runner: ubuntu-latest
          - target: arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up the StartOS build environment
        uses: Start9Labs/start-technologies/.github/actions/setup-build-env@master

      - name: Provision a workspace signing key
        run: |
          start-cli init-key
          mkdir -p ../../.startos
          cp ~/.startos/id.key.pem ../../.startos/build.key.pem

      - name: Install the package's dependencies
        run: npm ci

      - name: Build the ${{ matrix.target }} package
        run: make ${{ matrix.target }}

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: crm_${{ matrix.target }}
          path: deploy/startos/*.s9pk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
